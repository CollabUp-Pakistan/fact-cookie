# Render blueprint for Fact Cookie backend.
# Repo root must be the "Fact Cookie" folder (contains openai-agents-python + backend).
services:
  - type: web
    name: factcookie-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_DEV_ENDPOINTS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LLM_MODE
        value: mock
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BILLING_PROVIDER
        value: mock
